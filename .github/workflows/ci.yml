# CodeIDE — intégration continue GitHub Actions.
#
# MODE BINAIRE PAR DÉFAUT (arbitrage du 2026-10-18) : la CI NE CLONE PLUS
# les dépôts frères — les coordonnées com.github.jjoblab.* résolvent les
# 18 paquets de GitHub Packages (secret CODEIDE_PACKAGES_PAT, jeton de
# lecture — les paquets publics exigent une auth MÊME). Le chemin
# composite des sources reste vérifié par le job de GARDE-FOU nocturne
# (garde-fou-composite) qui clone les frères aux versions épinglées du
# catalogue et construit avec -Pfreres.sources.
#
# Compile et vérifie le projet depuis GitHub (demande utilisateur, étape
# T6) : la même chaîne que la vérification locale complète, SANS `clean`
# (le build cache et la configuration cache font le travail — voir ADR
# 0037). Les réglages mémoire séquentiels de gradle.properties sont
# conservés tels quels : le workflow ne dérègle rien côté machine.
#
# Les artefacts (APK debug, nommé avec la version) sont téléchargeables
# depuis la page du run. L'APK est signé par le keystore debug PUBLIC
# versionné (ADR 0067) et la signature est VÉRIFIÉE à chaque run :
# les APK successifs se mettent à jour les uns sur les autres, sans
# « conflit de package ».
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Garde-fou composite nocturne (03:00 UTC) : prouver que les SOURCES
    # des 4 dépôts s'assemblent toujours — le chemin par défaut consomme
    # les paquets publiés, il ne voit jamais un frère se casser.
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation et vérification complète (binaire Packages)
    runs-on: ubuntu-latest
    # Le schedule ne déclenche que le garde-fou composite.
    if: github.event_name != 'schedule'
    env:
      # Lecture GitHub Packages (settings.gradle.kts — le registre exige
      # une auth même pour un paquet public). Le secret porte un PAT
      # read:packages ; les PR de forks n'y accèdent pas (résolution
      # binaire impossible — repo mono-propriétaire, non applicable).
      CODEIDE_PACKAGES_PAT: ${{ secrets.CODEIDE_PACKAGES_PAT }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      # AUCUN clone frère : la CI consomme les paquets publiés (tooling
      # 1.0.0, lsp 1.0.0, LayoutLib 3.4.7 — versions épinglées dans
      # gradle/libs.versions.toml, alignées par scripts/bump-frere.sh).
      # Le chemin SOURCE (composite) est couvert par le job nocturne
      # garde-fou-composite ci-dessous.

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (cache wrapper + dépendances)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/tags/' }}

      # Signature debug STABLE — keystore public VERSIONNÉ dans
      # config/signature/ (ADR 0067) : le runner GitHub n'embarque aucun
      # ~/.android/debug.keystore et les caches actions/cache sont scopés
      # par ref (les runs de tags poussés ensemble ne se voient pas) et
      # évictables (7 jours d'inactivité) — chaque APK CI portait une
      # signature différente et Android refusait la mise à jour (« conflit
      # de package », retours v0.35.2 puis v0.37.1). La clé debug n'est pas
      # un secret (identifiants publics, patrons AOSP/CodeAssist) : la
      # versionner fixe l'identité pour la CI, les contributeurs et toute
      # machine locale. Aucun cache nécessaire : la clé voyage avec les
      # sources.

      # Les licences du SDK préinstallé du runner sont déjà acceptées ;
      # ce rite ne fait qu'assurer que sdkmanager peut auto-installer
      # une plateforme manquante (compileSdk 37.2) si besoin.
      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Vérification complète (sans clean — caches Gradle)
        run: ./gradlew spotlessCheck detekt checkModuleDependencies lintDebug testDebugUnitTest koverVerify assembleDebug --stacktrace

      - name: Version du projet
        id: version
        run: echo "nom=$(sed -n 's/^VERSION_NAME=//p' version.properties | head -1)" >> "$GITHUB_OUTPUT"

      # L'APK sort en app-debug.apk : le renommer avec la version rend les
      # téléchargements successifs distinguables sans ouvrir l'archive
      # (v0.37.0 contre v0.37.1, etc.).
      - name: Renommer l'APK avec la version
        run: |
          version="${{ steps.version.outputs.nom }}"
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/CodeIDE-v${version}-debug.apk"

      # Verrou ADR 0067 : le run échoue si l'APK n'est pas signé par le
      # keystore versionné — le « conflit de package » ne peut plus
      # revenir silencieusement.
      - name: Signature = keystore versionné (ADR 0067)
        run: |
          scripts/verify-signature.sh \
            "app/build/outputs/apk/debug/CodeIDE-v${{ steps.version.outputs.nom }}-debug.apk"

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CodeIDE-v${{ steps.version.outputs.nom }}-debug
          path: app/build/outputs/apk/debug/CodeIDE-v${{ steps.version.outputs.nom }}-debug.apk
          if-no-files-found: error

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-echec-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # GARDE-FOU COMPOSITE (nuit, 03:00 UTC — déclenchable aussi à la main) :
  # le chemin par défaut consomme les paquets publiés et ne verrait jamais
  # un frère se casser. Ce job clone les trois frères aux versions ÉPINGLÉES
  # DU CATALOGUE (gradle/libs.versions.toml — la même source que le binaire)
  # et prouve que les sources des 4 dépôts s'assemblent toujours ensemble,
  # via l'opt-in -Pfreres.sources. Chaîne bornée (pas de tests/lint/kover —
  # c'est le job binaire ci-dessus qui les porte) : style, frontières de
  # modules et compilation complète de l'app, JAR orchestrateur inclus.
  garde-fou-composite:
    name: Garde-fou — intégration composite des sources
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Récupérer les frères aux versions épinglées du catalogue
        run: |
          layoutlib="$(sed -n 's/^layoutlib = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -1)"
          tooling="$(sed -n 's/^codeide-tooling = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -1)"
          lsp="$(sed -n 's/^codeide-lsp = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -1)"
          echo "Épinglage catalogue : LayoutLib v$layoutlib, tooling v$tooling, lsp v$lsp"
          git clone --depth 1 --branch "v$layoutlib" \
            https://github.com/jjoblab/LayoutLib.git ../LayoutLib
          git clone --depth 1 --branch "v$tooling" \
            https://github.com/jjoblab/codeide-tooling.git ../codeide-tooling
          git clone --depth 1 --branch "v$lsp" \
            https://github.com/jjoblab/codeide-lsp.git ../codeide-lsp

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (cache wrapper + dépendances)
        uses: gradle/actions/setup-gradle@v4

      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Intégration composite (opt-in -Pfreres.sources)
        run: ./gradlew -Pfreres.sources spotlessCheck detekt checkModuleDependencies assembleDebug --stacktrace
