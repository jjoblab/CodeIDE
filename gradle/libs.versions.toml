# CodeIDE — catalogue de versions.
# Chaque version a été vérifiée sur son dépôt officiel le 2026-09-22 :
# AGP, AndroidX : https://dl.google.com/android/maven2
# Kotlin, KSP, Hilt, tests : https://repo.maven.apache.org/maven2
# Plugins Gradle : https://plugins.gradle.org
#
# Contrainte structurelle : AGP 9.4.1 embarque KGP 2.2.10 pour le Kotlin
# intégré ; kotlinx-serialization 1.9.0 est la dernière version compilée
# avec un Kotlin 2.2 lisible (1.10+ exige Kotlin 2.3).

[versions]
# Chaîne de build.
agp = "9.4.1"
kotlin = "2.2.10"
ksp = "2.3.12"
hilt = "2.60.1"
room = "2.8.5"

# SDK (source unique pour les convention plugins ; section 2 du prompt).
compileSdk = "37"
compileSdkMinor = "2"
minSdk = "26"
# 28, pas la dernière API : Android 10 interdit à une app targetSdk >= 29
# d'exécuter (exec) un binaire écrit dans ses données — restriction W^X.
# Tout le modèle du terminal intégré (second stage, apt, shell, JDK du
# bootstrap) exécute des binaires extraits dans filesDir/usr : le
# targetSdk reste bloqué à 28, précédent Termux (même raison). App
# chargée par side-loading — l'exigence Play (>= 34) ne s'applique pas.
# ADR 0045 ; règle maintenue après le retour d'appareil réel (v0.31.1).
targetSdk = "28"

# AndroidX.
androidx-annotation = "1.10.0"
androidx-core = "1.19.0"
androidx-appcompat = "1.8.0"
androidx-activity = "1.13.0"
androidx-fragment = "1.9.0"
androidx-navigation = "2.10.1"
androidx-lifecycle = "2.11.0"
androidx-recyclerview = "1.4.0"
androidx-swiperefreshlayout = "1.2.0"  # vérifiée sur Google Maven (dernière stable)
androidx-viewpager2 = "1.1.0"
# Bibliothèque d'édition (prompt compagnon, section 2.2) — tag stable vérifié
# sur github.com/jjoblab/code-editor le 2026-10-16 ; artefacts JitPack vérifiés
# (cel-ui / cel-lsp / cel-lsp-api 3.72.0 : build JitPack « ok » le 2026-10-16).
# Montée 3.71.0 → 3.72.0 (v0.134.23) : multi-langages ADR-002 (C1→C3→C2/C4) —
# TEXTMATE NON CONSOMMÉ (consigne propriétaire : pas encore stable ; le module
# :cel-textmate et les grammaires embarquées restent hors du graphe CodeIDE —
# CodeIDE ne consomme que cel-ui + cel-lsp, la bascule démo est opt-in).
# Consommé du lot : C4 = palette EditorTheme étendue (8 clés syntax.* virtuelles,
# additive) ; C1 = politique de porte de complétion devenue donnée du profil
# (CompletionGate — XML porte écartée préservé, LOG jamais ; comportement
# identique côté hôte) ; correctifs retour terrain (RegexCompat classes POSIX,
# captures vide/imbriquées, porte 5 000 caractères/ligne). Aucune rupture
# d'API 3.71.0 → 3.72.0 (vérifié : cel-ui = EditorTheme + EditorCompletionPopup
# seulement, cel-lsp/cel-lsp-api = README).
# Historique — montée 3.70.1 → 3.71.0 (v0.134.12) : plan d'audit 3.69.0
# (lots L1→L10). UNE rupture consommée par CodeIDE (plan 03 — inversion
# cel-lsp → cel-ui) : LspEditor.setEditorView(EditorView) → setHost(EditorHost) ;
# l'adaptation est l'une-ligne fournie par l'amont — editeur.setHost(LspEditorViewHost(vue))
# (CoordonnateurLsp). Le reste est compatible : plan 01 = extractions d'état
# d'EditorView (view/state/ CompletionState, FindState, ScrollState) avec API
# publique inchangée (getVOffset/getHOffset délèguent, champs internalisés non
# consommés par CodeIDE — vérifié par grep) ; D-01 = complétion snippets +
# textEdit + filterText/sortText (transparents côté hôte) ; L1-bis = timeouts
# LSP par requête (LanguageServerDefinition.setTimeouts, additif, non posé) ;
# OnTextEditListener gagne une variante 4-arg DEFAULT (3-arg conservé) ;
# SymbolBarView = interne accessibilité A-05 (performClick). Licence du dépôt
# code-editor : MIT → Apache-2.0 (les notices tierces deviennent exactes).
# Montée 3.49.2 → 3.69.0 (v0.122.2) : compat API vérifiée par le guide
# MISE-A-JOUR-CODEIDE.md (docs/ du dépôt code-editor) — plage additive.
# CodeEditor côté CodeIDE ne change pas (les deux modules suivent version.ref).
# Montée 3.72.0 → 3.74.0 (v0.168.0) : phase 2 du chantier « Capacités
# LSP fermées par défaut » (ADR 0136) — la montée franchit AUSSI la 3.73.0
# (carte d'aperçu « goutte d'eau » + IME au niveau plateforme : AUCUN
# contournement clavier à retirer côté CodeIDE — vérifié, seul le filtre
# logcat masque le clavier, hors EditorView). 3.74.0 = cycle de vie du
# langage (disconnect() restaure EmptyLanguage — ADR 0136 D1 : le défaut
# qui laissait fuiter les capacités du fichier précédent est corrigé DANS
# LA BIBLIOTHÈQUE, aucun contournement local) + formatage complet :
# canFormat()/canFormatSelection()/formatSelection(Consumer<Boolean>)/
# setFormattingOptions(int,boolean), Ctrl+Shift+K physique porté par la
# bibliothèque (EditorCommands.FORMAT_SELECTION). Consommé du lot :
# pilotage de « Formater » par canFormat() (D4), « Formater la sélection »
# dans la pill de sélection (grisée par canFormatSelection()), options
# de formatage alimentées par le réglage « Largeur de tabulation »
# RÉINTRODUIT (ADR 0066 : « réintroduits si la bibliothèque expose un
# jour les setters » — setFormattingOptions EST ce setter). Aucune
# rupture d'API (note de passage §3.74.0 du dépôt frère : tout est
# additif, méthodes default ou nouvelles) ; artefacts JitPack v3.74.0
# vérifiés HTTP 200 (cel-ui, cel-lsp, cel-lsp-api).
# Montée 3.74.0 → 4.0.0 (bump-frère du 2026-10-24, instruction
# propriétaire « mettre à jour la version des dépôts frères et aussi
# dans CodeIDE ») : refonte INTERNE de cel-textmate (moteur natif du
# dialecte, plan 10 — les 7 règles markdown à récursion et la règle CSS
# selector compilent nativement, budget 100 ms par essai : un motif
# catastrophique se replie en non-correspondance) + régime PROGRESSIF
# des grands documents dans cel-core (plan 11 : au-delà de 800 lignes
# plus AUCUNE passe complète — états en arrière-plan interruptibles,
# spans à la demande, cache LRU 4 096 lignes ; ouverture 480k lignes
# ~619 ms → ~200-330 ms, tas 147 Mo → ~26 Mo) + corpus de grammaires
# porté de 10 à 23 (c, cpp, dockerfile, go, json, php, ruby, rust,
# shell, sql, toml, typescript, yaml MIT/Apache-2.0 VERBATIM) — le
# panneau couleur de CodeIDE gagne 13 langages SANS AUCUN changement
# de code. API hôte : UNIQUEMENT l'additif `hintViewport(first,last)`
# (EditorView, plan 11 — optionnel, non consommé pour l'instant) ; la
# constante renommée TEXTMATE_LINE_LIMIT → TEXTMATE_EAGER_LIMIT est
# interne à cel-core (vérifié : aucun usage côté CodeIDE). Le tag
# v4.0.0 porte le correctif des plafonds de bancs sur runners CI
# partagés (849bf3c — la 4.0.0 tagée EST la 4.0.0 testée) ; build
# JitPack v4.0.0 « ok » (API builds, vérifié le 2026-10-24 : 4.0.0 et
# v4.0.0 tous deux ok). MONTÉE 4.1.0 (C3 — ADR 0142, bump-frère) : le
# contrat interactif B27-C3 du corps de la carte « goutte d'eau »
# (wantsInteractiveDropPreview/onPreviewDropTouch/onPreviewDropLongPress,
# méthodes à défaut — les hôtes non interactifs au bit près) ; build
# JitPack v4.1.0 « ok » (l'API B27-C3 compile côté CodeIDE — la chaîne
# locale de v0.176.0 a résolu et testé l'artefact). MONTÉE 4.2.0
# (C4 — ADR 0143, bump-frère) : le contrat B28 des YEUX ANCRÉS — un
# œil par `@Preview` À SA LIGNE, façon Android Studio
# (setPreviewAnchors — null = comportement B27 au bit près, VIDE =
# aucun œil ; hitTestGutterPreviewAnchor ; onPreviewAnchorTapped à
# défaut ; selectPreviewDropTab — miroir d'un tap d'onglet) ; build
# JitPack v4.2.0 « ok » (la chaîne locale de v0.177.0 a résolu et
# testé l'artefact). MONTÉE 4.2.0 → 4.5.1 (bump-frère du 2026-10-27,
# instruction propriétaire « Monte la version de code-editor dans
# CodeIDE ») : plage STRICTEMENT ADDITIVE (guide
# MISE-A-JOUR-CODEIDE.md §4.3.0 → §4.5.1 : « aucune rupture d'API »,
# aucune migration obligatoire). 4.3.0 = complétion fiabilisée
# (drapeau LSP isIncomplete honoré : re-requête débouncée et
# coalescée sur liste tronquée, classement local par paliers sur
# l'IDENTIFIANT DE TÊTE, appariement unifié CompletionMatcher — les
# indices en gras sont EXACTEMENT ceux qui ont matché, affichage
# riche container/documentation ; dépréciations à DÉLÉGATION, aucun
# retrait côté hôte) ; 4.3.1 = démo seulement (bibliothèque
# inchangée) ; 4.4.0 = occurrences du mot courant (défaut ACTIVÉ —
# cède TOUJOURS la voie à la session de recherche et à
# setFindHighlights, NON posé par CodeIDE : vérifié, aucun conflit),
# modificateurs sémantiques barré/gras/italique (légende serveur
# requise — codeide-lsp ne l'annonce pas encore : aucun rendu avant
# ce chantier frère) et panneau de documentation du popup ; 4.5.0 =
# apprentissage du classement (défaut activé : les candidats
# acceptés remontent à palier et groupe égaux), gabarits à choix +
# macros $FILE$/$USER$, postfix .sout par profil, mode gros fichiers
# AUTO (inchangé sous les seuils), renommage XML lié balise
# ouvrante ↔ fermante en UNE étape d'annulation (défaut activé —
# CodeIDE ne gère AUCUN miroir maison : vérifié, :preview:xml est
# hors éditeur), compensation du viewport des éditions groupées
# au-dessus de l'écran (anti-saut des auto-imports), barre de
# touches EditorTouchBar (JAMAIS posée par la bibliothèque :
# adoption à instruire en ADR ultérieure, aucun coût tant qu'elle
# n'est pas au layout) ; 4.5.1 = correctifs démo seulement. POINTS
# D'ATTENTION 4.5.0 SANS action pour CodeIDE : le recentrage coupé
# PENDANT les lots beginBatch/endBatch est le comportement VOULU
# (FantomeCompletionIa accepte en un lot, aucun recentrage
# intermédiaire utile). PONT EFFECTIF (règle 9, résolution vérifiée
# AVANT/APRÈS montée) : cel-lsp transitif du host:1.15.0 reste
# 3.74.0 — état hérité des montées 4.0.0 → 4.2.0, l'alignement
# attend le chantier serveur « drapeau isIncomplete honnête » du
# frère (guide §4.3.0 §5) ; setIncomplete (no-op au défaut) et
# provideResult 5-args (enveloppe au défaut) sont ADDITIFS : le pont
# 3.74.0 compile et fonctionne contre cel-core/cel-lsp-api 4.5.1,
# les re-requêtes 4.3.0 ne s'activeront qu'à l'alignement du frère.
# Artefacts JitPack v4.5.1 vérifiés HTTP 200 (cel-core .pom, build
# « ok ») ; la chaîne locale de v0.200.0 résout et teste l'artefact.
# MONTÉE 4.5.1 → 4.9.1 (bump-frère du 2026-10-28, instruction
# propriétaire « mettre à jour CodeIDE pour utiliser la dernière
# version de code-editor »). Plage vérifiée au code des DEUX côtés
# (CodeIDE v0.200.14 + cel-lsp 3.74.0 du pont) : 4.6.0 retrait des 17
# dépréciations hors fenêtre — AUCUNE utilisée (grep des deux arbres :
# les onTextChanged trouvés sont des TextWatcher Android 4-args, pas
# le LspEditor.onTextChanged(CharSequence) retiré) + persistance de
# l'apprentissage snapshot()/restore() DISPONIBLE (recommandation du
# guide, adoption laissée au chantier réglages) ; 4.7.0 résolution
# paresseuse de la documentation — côté VUE (dwell 200 ms, cache,
# pré-remplissage : actif), côté FOURNISSEUR resolveDocumentation est
# un défaut no-op : DORMANT derrière le pont 3.74.0 (même statut que
# les re-requêtes 4.3.0, s'activera à l'alignement du frère) ; 4.8.0
# plancher de complétion fusionné (défaut ACTIF : mots-clés/snippets
# du profil AJOUTÉS à la réponse du fournisseur, dédupliqués par
# libellé, réponse VIDE respectée — bascule publique
# setMergeBuiltinCompletionsEnabled), session vierge NEUTRE (text au
# lieu de java : ALIGNÉ sur le « repli neutre » documenté de
# FichiersOuverture — les extensions inconnues ne colorent plus en
# Java, le comportement rejoint l'intention écrite), aide de signature
# redessinée (largeur adaptative, paramètre actif garanti visible,
# badge de surcharges tactile), repli signature/postfix bornés aux
# langages à appels (callSyntax) ; 4.9.0 tir sémantique indépendant
# des diagnostics + purge à la déconnexion — INTERNE au cel-lsp 4.9.0
# : DORMANT derrière le pont 3.74.0 (le puller du pont tire sur
# publishDiagnostics ; les serveurs du frère n'annoncent pas encore
# la légende : aucun changement visible) ; 4.9.1 popup de complétion
# DEUX LIGNES (correctif demandé par le propriétaire : le FQCN — ex.
# android.widget.Button pour le candidat Button — vit SOUS le nom en
# atténué, plus JAMAIS à l'horizontale contre lui ; rangées 28 → 40
# dp, badge plafonné, glyphe ⓘ avec réserve dédiée) — ACTIF côté
# cel-ui dès la compilation ; bornes 4.9.1 côté graphe : jars
# joni/jcodings INTÉGRÉS au dépôt frère (POM cel-textmate sans les
# coordonnées — cel-textmate est HORS du graphe CodeIDE, aucun
# impact de résolution, c'est ce qui rend le tag constructible sur
# JitPack). PONT RE-VÉRIFIÉ : cel-lsp transitif du host:1.15.0 reste
# 3.74.0, compileOnly sur cel-core/cel-lsp-api — aucun des 17
# symboles retirés n'est référencé par le v3.74.0 (grep), le pont
# fonctionne contre cel-core/cel-lsp-api 4.9.1. Artefacts :
# publication GitHub Packages 4.9.1 SUCCÈS (5 paquets, run du tag
# v4.9.1) ; build JitPack v4.9.1 « ok » (5 modules, AAR vérifiés
# téléchargeables) — les jars joni/jcodings intégrés au dépôt rendent
# la construction AUTONOME (elle dépendait du miroir Central de
# JitPack, jamais synchronisé pour joni 2.2.8 — v4.7.0 → v4.9.0
# resteront invendables sur ce canal, sans importance : la 4.9.1 les
# remplace) ; la chaîne locale de v0.201.0 a compilé et testé contre
# la résolution JitPack RÉELLE (v4.9.1 vert au moment de la montée) ;
# résolution JitPack re-vérifiée HTTP 200 avant la poussée sur main.
# MONTÉE 4.9.1 → 4.10.0 (2026-10-28, « lance tous les chantiers ») :
# l'aide de signature ne se tait plus — UNE surcharge à la fois (stepper
# ‹ i/n › tactile borné, fenêtrage ±1 au-delà de 5 paramètres, PEEK
# complet par appui long) ; un résolveur branché ne reste maître que
# d'une réponse NON VIDE (repli local sur l'appel vivant, porte
# callSyntax inchangée) ; rangées de complétion à TROIS axes (libellé
# seul / container à gauche / détail à droite), badge 6 dp, quatre
# coins 14 dp. API : signatureHelpBadgeMetrics REMPLACÉ par
# signatureHelpStepperMetrics + signatureHelpPopupMetrics (aucun usage
# CodeIDE) ; SignatureHelpController.isPeeked/setPeeked additif.
# Artefacts : publication GitHub Packages v4.10.0 SUCCÈS (5 paquets,
# run du tag v4.10.0) ; CI main : re-run du bench flaky
# EditorSessionBenchmark.undoRedo (budget 2 s, runner chargé — même
# incident que v4.8.0, passé vert au re-run).
# MONTÉE 4.10.0 → 4.14.1 (bump-frère du 2026-10-30, instruction
# propriétaire « mettez à jour code-editor à la dernière version ») :
# la plage 4.11.0 → 4.14.1 est STRICTEMENT ADDITIVE (guide
# MISE-A-JOUR-CODEIDE.md de CHAQUE version intermédiaire : « aucune
# action obligatoire », aucune API publique retirée ni changée) —
# vérifié en plus par l'inventaire des imports cel de CodeIDE contre
# les sources v4.14.1 : LspProject/LspEditor/LspLogSink/
# LanguageServerDefinition/InProcessStreamConnectionProvider (cel-lsp),
# EditorView/LspEditorViewHost/EditorTheme/SymbolBarView/render/
# preview (cel-ui), EditorSession/EditorDocument/Selection/
# DiagnosticShift (cel-core transitif) — TOUS présents. 4.11.0 = aide
# de signature TROIS PALIERS (paramètres passés en accent, actif en
# gras, à venir atténué ; paramètre actif PAR SIGNATURE LSP 3.16 —
# SignatureInformation.activeParameter l'emporte sur le champ global) ;
# 4.12.0 = complétion contextuelle P1-B (constantes d'enum, attributs
# d'annotation, arguments nommés) + implémenter les membres manquants
# P1-C (MOTEURS DE DÉMO — ponts clients déjà existants ; nouvelle API
# optionnelle EditorView.setCompletionTriggerCharacters NON posée par
# CodeIDE : la voie LSP reste prioritaire) ; 4.13.0 = documentation de
# classpath au survol et à la signature + indices lambda (démo) et
# CORRECTION CLIENT utile aux serveurs réels : positionVersOffset en
# arithmétique longue sur la borne (ligne, Integer.MAX_VALUE) des
# plages inlayHint ; 4.14.0 = refactorings wrap/cast/surround (genre
# refactor.rewrite), références et renommage à portées honnêtes
# (prepareRename REFUSE les noms surchargés/ambigus entre enums),
# auto-import du classpath (quickfix — ponts clients existants :
# LspReferencesProvider, LspRenameProvider, application WorkspaceEdit
# compensée viewport 4.5.0) ; 4.14.1 = rendu des inlay hints RÉPARÉ
# (taille du code sur la MÊME baseline, padding LSP = UN espace net
# exact, ligatures tissées, loupe réparée du même coup — rapport
# terrain). APPARIEMENT : ces versions sont les contreparties CLIENT
# des chantiers Kotlin du frère codeide-lsp 1.17.0 → 1.23.0 (P1-B ↔
# 4.12.0, fiche classpath/KDoc ↔ 4.13.0, wrap/cast/surround ↔ 4.14.0)
# — CodeIDE porte déjà l'hôte 1.23.0 depuis v0.203.0 : la montée
# RÉ-ALIGNE le client sur l'hôte. PONT RE-VÉRIFIÉ (règle 9) : cel-lsp
# transitif du host:1.23.0 reste 3.74.0, la résolution effective passe
# à v4.14.1 (« v4… » > « 3.74.0 » en comparaison Gradle) ; aucun
# symbole retiré depuis 3.74.0 n'est référencé (les 17 retraits de
# 4.6.0 vérifiés « AUCUNE utilisée » à la montée 4.9.1, aucune rupture
# déclarée depuis — le pont compile et fonctionne contre
# cel-core/cel-lsp-api 4.14.1). Artefacts : build JitPack v4.14.1
# « ok » (API builds : status ok, 5 modules, commit 3eb8096 = le tag ;
# .pom cel-lsp/cel-ui/cel-core/cel-lsp-api/cel-textmate vérifiés HTTP
# 200, résolution Gradle réelle exercée par le harnais de vérification
# du bump) ; publication GitHub Packages v4.14.1 en succès (run du
# tag v4.14.1).
code-editor = "v4.14.1"
# Termux terminal-emulator (Apache-2.0) : sessions shell via pty — v0.118.3
# vérifiée sur JitPack le 2026-09-23 (com.github.termux.termux-app).
termux = "v0.118.3"
androidx-splashscreen = "1.2.0"
androidx-datastore = "1.2.1"
material = "1.14.0"

# Kotlin (bibliothèques).
coroutines = "1.11.0"
serialization = "1.9.0"
# LSP Kotlin (K1, ADR 0115) : org.jetbrains:syntax-api — l'arbre de
# construction syntaxique de la plateforme IntelliJ, contre lequel la
# grammaire vendorée du compilateur Kotlin est écrite. Hors Central :
# dépôt intellij-dependencies (accès par cache-redirector, voir
# settings.gradle.kts). Version épinglée par le tag amont v2.3.0 dans son
# propre libs.versions.toml — à monter ENSEMBLE du vendoring
# (lsp/kotlin/src/main/vendor/VENDOR.md). jetbrains-annotations (Central)
# est la seconde dépendance amont.
jetbrains-syntax-api = "0.3.340"
jetbrains-annotations = "26.0.2"
# K3 (LSP_KOTLIN.md §5) : lecture des @Metadata des bibliothèques Kotlin
# du classpath (appelables de premier niveau + extensions) — même version
# que le compilateur du build (2.2.10), la bibliothèque suit le
# compilateur au pas ; zéro transitif gênant (LSP_KOTLIN §6 : embarquée
# dans le futur « pack langue » avec la grammaire).
kotlin-metadata-jvm = "2.2.10"

# Tests.
junit4 = "4.13.2"
androidx-test-core = "1.7.0"
robolectric = "4.17"
turbine = "1.2.1"
# org.json réel pour les tests JVM purs de core:crash (les stubs android.jar
# lèvent « not mocked » ; version vérifiée sur Maven Central).
org-json = "20260814"
turbine-coroutines-test = "1.11.0"

# Diagnostics en debug.
leakcanary = "2.14"

# Qualité (section 6 du prompt).
detekt = "1.23.8"
spotless = "8.10.2"
ktlint = "1.8.0"
kover = "0.9.9"
dokka = "2.2.0"

