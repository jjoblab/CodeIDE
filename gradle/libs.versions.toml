# version déclarée — la mise à jour = bump ici + ref du clonage CI.
codeide-tooling = "1.0.0"
# MONTÉE 1.8.0 (v0.180.0) : v1.8.0 livre les CINQ demandes du chantier
# indexation transmises par docs/DEMANDES_CODEIDE_LSP.md (ADR 0211–0214 —
# D1 supplier de connexion sans E/S + cache mémoire des segments, D2 filet
# de scan synchrone supprimé + verrou lecture-écriture, D3 etatIndexation
# Kotlin/XML RICHE (même type public que Java), D4 reesayerEchecs() ciblé,
# D5 annulerPassage() coopératif). Toutes ADDITIVES : la surface hôte
# consommée par CodeIDE (SessionLsp*/CapaciteLsp/TypesIndexationPublics)
# n'en est que RICHE (etatIndexation sur les 3 façades, annulerPassage()/
# reesayerEchecs() : Boolean) — le branchement UI vit dans cette version
# (ADR 0146 : agrégat multi-moteurs sur les flux RÉELS + boutons enfin
# distincts). v1.9.0 (v0.181.0 — retour propriétaire E2E sur projets
# Android réels, ADR 0215/0216 côté frère) puis 1.9.1 (retour
# propriétaire complétion Java : cache négatif de présence source — la
# résolution ne stat plus le disque pour chaque type du classpath, le
# vrai goulot FUSE ; filtre des classes internes brutes R$style/R$id/
# R$string des complétions d'import/types/quick-fix ; déclencheurs de
# complétion resserrés à "." et "@" — plus de popup spontané après un
# espace ou un retour à la ligne). SANS changement de surface consommée
# (v1.9.0 intacte). Publication GitHub Packages du tag v1.9.1 vérifiée.
# MONTÉE 1.12.0 (v0.190.0) : v1.10.0 → v1.12.0 parité LSP Kotlin
# Android Studio (rapport d'audit final du frère — Compose, Views,
# KMP, scripts Gradle : ADR 0217–0223) : zéro faux positif sur le
# template Compose canonique, monde non-Compose (Views) au niveau AS,
# membres d'objets KMP scannés, nus muets dans les .gradle.kts (plus de
# faux kt.unresolved sur les scripts), companions sans nom (récepteur
# statique fqcn$Companion), sélection d'appelé par types complets.
# SANS rupture de la surface consommée (drap ADR 0219-0223 : tables
# par langage CÔTÉ FRÈRE uniquement — CapaciteLsp/SessionLsp*/
# ConfigurationLsp intacts, méthodes de session ajoutées avec DÉFAUTS
# HONNÊTES VIDES, cf. docs/MISE-A-JOUR-CODEIDE.md du frère) ; trois
# NOUVELLES lignes d'interrupteur effectives apparaissent (références
# XML, formatage + indices Kotlin) car la liste est DÉRIVÉE des
# capacités réelles. Publication GitHub Packages v1.12.0 vérifiée.
# Montées précédentes : 1.9.1 (retour propriétaire complétion Java),
# 1.9.0 (v0.181.0 — routage module ADR 0215), 1.8.0 (v0.180.0 — écran
# d'indexation multi-moteurs, ADR 0146), 1.7.0 (v0.179.0 — GO TO
# symétrique, ADR 0208–0210), 1.5.0 (C4 — ADR 0143, ligne d'annotation
# @Preview).
# MONTÉE 1.16.0 → 1.23.0 (2026-10-30, « le chaînon restant franchi » —
# LA BASCULE DU MOTEUR LSP JAVA) : :lsp:host consomme le moteur Java
# RÉÉCRIT (jo.codeide.lsp.java:1.1.0 + compagnon ecj-art runtimeOnly,
# option B — routeur multi-modules AU PROTOCOLE : une session LSP Java
# vivante par projet, moteurs résolus PAR REQUÊTE, invariant ADR 0211
# « nourrissage moteur unique par sync » préservé à travers les
# reconfigurations à chaud, fiche 066 du moteur). Le moteur vendored
# :lsp:java du frère est ARCHIVÉ (ADR 0233 : gelé, plus consommé par
# AUCUN module — retrait physique après « 2 versions sans régression »).
# Surface publique hôte INTACTE (SessionLsp/CapaciteLsp inchangées, JSON
# NavigationTarget repris à l'identique par NavigationCible — le client
# cel-lsp est consommé TEL QUEL) ; extensions maison
# superDefinition/decompiledSource annoncées en experimental (miroir du
# vendord — les entrées UI restent vivantes) ; live-republish des
# documents ouverts après chaque remplacement de contexte. Deux deltas
# assumés à surveiller côté consommation : semanticTokens NON annoncé
# (coloration de repli conservée, aucune attente silencieuse) et
# source.organizeImports PAS encore servi au fil LSP (API moteur seule
# — l'action ne doit pas apparaître morte côté UI). Témoin attendu au
# premier lancement : serverInfo = lspjava 1.1.0 consigné à CHAQUE
# connexion LSP Java. Guide de passage : docs/MISE-A-JOUR-CODEIDE.md du
# frère ; retour arrière = substitution inverse (descendre à 1.22.1).
# Publication GitHub Packages v1.23.0 vérifiée ; CI verte (baseline de
# parité du corpus régénérée pour absorber les 10 fichiers .kt du
# chaînon — grammaire SANS changement).
# MONTÉE 1.15.0 → 1.16.0 (2026-10-28, « lance tous les chantiers ») :
# le moteur ECJ gagne les variantes réparées de l'aide de signature
# (appels non refermés add( / add(1, / chaînes ouvertes / arguments à
# moitié tapés — le popup ne se vide plus pendant la frappe) et
# l'énumération des surcharges de CONSTRUCTEUR (new StringBuilder(
# sert les 4). Complétion contextuelle : filtres grammaticaux
# (extends → classes concrètes, implements → interfaces, throws/catch
# → Throwables, new → concrets, @anno → annotations), stubs
# d'override en corps de classe (snippets @Override complets),
# suggestions de noms en déclaration (Button but| → button),
# constantes d'enum dans les case, attributs d'annotation. Aucun
# changement de protocole ni de SPI. Artefacts : publication GitHub
# Packages v1.16.0 SUCCÈS ; CI main : incident réseau Maven Central
# transitoire (résolution gson) au premier passage, re-lancé.
codeide-lsp = "1.23.5"

# Moteur Java LSP RÉÉCRIT (bascule §8.5 signée le 30/10/2026 — dépôt
# jjoblab/code-lsp) : publication GitHub Packages sur tag v* (workflow
# publish.yml). PIN MIROIR du catalogue du frère codeide-lsp (0ca7e7b) :
# la dépendance moteur vit dans le POM de l'hôte (host 1.23.0 la déclare
# api + compagnon ecj-art runtimeOnly) — AUCUN module de CodeIDE ne
# consomme la coordonnée directement, ce pin documente la version du
# moteur que l'hôte transporte (v1.1.0 : régime vivant au protocole,
# cheminDeUri double forme file:/path, live-republish, contrat
# superDefinition {path, start, end, label} miroir du vendord ; v1.1.1 :
# correctif du diagnose rapide — le corps hôte était masqué par erreur
# de comparaison d'identité entre deux scans, la frappe de l'utilisateur
# était EFFACÉE du texte diagnostiqué : plus AUCUN diagnostic à la
# frappe après l'ouverture saine d'un fichier — cause racine mesurée du
# retour appareil du 30/10, reproduite sur JVM par harnais miroir et
# corrigée côté code-lsp INTEGRATION-CODEIDE §9 ; v1.1.2 : correctif ART —
# le fournisseur jrt du lib/jrt-fs.jar du JDK externe lève
# ServiceConfigurationError à l'instanciation (un Error invisible à
# l'ancien catch (Exception)) : TOUTE requête répondait « Internal
# error. » sur appareil — capture Throwable, repli régime instantané
# documenté, INTEGRATION-CODEIDE §10 ; régression du fil appareil
# commitée dans l'hôte 1.23.2 — ReproductionFrappeAppareilTest ; v1.1.3 :
# retours appareil du 30/10 au soir (logs 025629, CodeIDE 0.204.2) — la
# chaîne est FRANCHIE mais trois familles muettes corrigées DANS le
# moteur : textDocument/superDefinition RECONNU (le @JsonRequest nu
# enregistrait le nom nu, le client cel-lsp appelle le nom complet —
# « Unsupported request method » au GO TO Super), familles analytiques
# ÉLARGIES (locale inutilisée table rapide, champ/méthode/type privé
# inutilisé table analytique, PORTAGE HORS CORPS pendant la frappe :
# l'import/membre inutilisé RESTE affiché), déclencheurs « . » ET « @ »
# miroir exact du vendord ; v1.1.4 : passe appareil 0.204.3 (logs
# 105910, « rien du tout, seulement du basic ») — l'appareil vivait en
# RÉGIME INSTANTANÉ : sur ART le jrt du JDK externe est ininstanciable
# (v1.1.2) ET l'ancienne sonde du régime plein ne voyait QUE le jrt,
# alors que le classpath porte android.jar. La sonde devient
# « java.lang.Object résoluble » (jrt OU jar du classpath porteur) :
# définitions, survol, documentHighlight, inlay, codeAction, tables
# analytiques « unused » et complétion de classpath repassent en régime
# plein sur l'appareil ; régression ART simulée verrouillée
# (PlateformeClasspathARTTest — INTEGRATION-CODEIDE §12 ; étude
# éditeur↔LSP du mandat propriétaire dans docs/etudes/editeur-lsp/)) ;
# v1.1.5 : banc PROJET ANDROID RÉEL du mandat propriétaire du 31/10
# (logs 124450, « exactement comme Android Studio ») — réplique monip +
# android.jar 34-ext12 + 16 AARs/jars réels, timeline appareil rejouée
# au protocole ; CINQ correctifs de précision de complétion : qualifier
# imbriqué (R.layout.a| propose ses constantes), auto-import en
# additionalTextEdits (insertion au point d'imports, jamais si inutile),
# marqueur de splice interne écarté de l'inventaire, identifiant isolé
# en corps = contexte NOM (la locale en tête du popup), classpath de
# banc à fermeture transitive réelle — INTEGRATION-CODEIDE §13).
# Résolution : rails settings.gradle.kts posés en 8450bb7 (mavenLocal
# filtré jo.codeide.lsp.java EN TÊTE + Packages jjoblab/code-lsp derrière
# le jeton de lecture). Mise à jour = bump ici EN MIROIR du catalogue
# codeide-lsp + tag v* côté code-lsp.
codeide-lsp-java = "1.1.5"

# Mission « Previews » Compose (PREVIEW.md §4 — PC2 : runtime Compose
# EMBARQUÉ comme bibliothèque d'interprétation dans :preview:compose,
# ADR 0002 intact — pas de Compose pour l'UI CodeIDE). BOM vérifiée sur
# Google Maven ; le plugin compose est livré AVEC Kotlin (2.0+).
compose-bom = "2026.09.00"

# Propriétaire d'état sauvegardé hors fenêtre (SavedStateRegistry factice
# de l'exécuteur off-screen :preview:compose) — version stable vérifiée
# sur Google Maven.
savedstate = "1.3.3"

# Interface ViewBinding pour core:ui (même version que l'AGP, vérifié sur Google Maven ;
# AGP l'ajoute automatiquement aux modules qui activent viewBinding, core:ui la déclare explicitement).
viewbinding = "9.4.1"

# Mission « LSP Java » (prompt 2 — versions du module vendored lsp-java, vérifiées sur
# les dépôts officiels le 2026-10-11 : Maven Central pour jdt/lsp4j/gson/asm/junit-jupiter,
# Google Maven pour builder-model qui suit le train de versions de l'AGP).
eclipse-jdt-core = "3.40.0"
lsp4j = "0.21.2"
gson = "2.10.1"
asm = "9.7"
junit-jupiter = "5.10.1"
# La version du lanceur suit la version de la PLATEFORME JUnit (1.10.x
# pour Jupiter 5.10.x), pas celle de Jupiter.
junit-platform = "1.10.1"
# builder-model (com.android.tools.build) : interfaces du modèle v2 d'AGP résolu via
# la Tooling API — même train de versions que l'AGP (9.4.1), vérifié sur Google Maven.
# Compatible avec les projets cibles AGP 8+ (les interfaces v2 sont stables depuis 8.0).
builder-model = "9.4.1"

