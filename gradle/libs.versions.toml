# Dépôts séparés (bascule 2026-10-17, docs/archive/PLAN_SEPARATION_DEPOTS.md §9) :
# protocol/api/server/testing (codeide-tooling) et les 8 modules lsp
# (codeide-lsp) consommés en coordonnées externes — composite en dev
# (substitution, settings.gradle.kts), BINAIRE depuis GitHub Packages
# (workflows publish.yml des deux dépôts ; JitPack reste l'alternative
