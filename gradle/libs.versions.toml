# CodeIDE — catalogue de versions.
# Chaque version a été vérifiée sur son dépôt officiel le 2026-09-22 :
# AGP, AndroidX : https://dl.google.com/android/maven2
# Kotlin, KSP, Hilt, tests : https://repo.maven.apache.org/maven2
# Plugins Gradle : https://plugins.gradle.org
#
# Contrainte structurelle : AGP 9.4.1 embarque KGP 2.2.10 pour le Kotlin
# intégré ; kotlinx-serialization 1.9.0 est la dernière version compilée
# avec un Kotlin 2.2 lisible (1.10+ exige Kotlin 2.3).

[versions]
# Chaîne de build.
agp = "9.4.1"
kotlin = "2.2.10"
ksp = "2.3.12"
hilt = "2.60.1"
room = "2.8.5"

# SDK (source unique pour les convention plugins ; section 2 du prompt).
compileSdk = "37"
compileSdkMinor = "2"
minSdk = "26"
# 28, pas la dernière API : Android 10 interdit à une app targetSdk >= 29
# d'exécuter (exec) un binaire écrit dans ses données — restriction W^X.
# Tout le modèle du terminal intégré (second stage, apt, shell, JDK du
# bootstrap) exécute des binaires extraits dans filesDir/usr : le
# targetSdk reste bloqué à 28, précédent Termux (même raison). App
# chargée par side-loading — l'exigence Play (>= 34) ne s'applique pas.
# ADR 0045 ; règle maintenue après le retour d'appareil réel (v0.31.1).
targetSdk = "28"

# AndroidX.
androidx-annotation = "1.10.0"
androidx-core = "1.19.0"
androidx-appcompat = "1.8.0"
androidx-activity = "1.13.0"
androidx-fragment = "1.9.0"
androidx-navigation = "2.10.1"
androidx-lifecycle = "2.11.0"
androidx-recyclerview = "1.4.0"
androidx-swiperefreshlayout = "1.2.0"  # vérifiée sur Google Maven (dernière stable)
androidx-viewpager2 = "1.1.0"
# Bibliothèque d'édition (prompt compagnon, section 2.2) — tag stable vérifié
# sur github.com/jjoblab/code-editor le 2026-10-16 ; artefacts JitPack vérifiés
# (cel-ui / cel-lsp / cel-lsp-api 3.72.0 : build JitPack « ok » le 2026-10-16).
# Montée 3.71.0 → 3.72.0 (v0.134.23) : multi-langages ADR-002 (C1→C3→C2/C4) —
# TEXTMATE NON CONSOMMÉ (consigne propriétaire : pas encore stable ; le module
# :cel-textmate et les grammaires embarquées restent hors du graphe CodeIDE —
# CodeIDE ne consomme que cel-ui + cel-lsp, la bascule démo est opt-in).
# Consommé du lot : C4 = palette EditorTheme étendue (8 clés syntax.* virtuelles,
# additive) ; C1 = politique de porte de complétion devenue donnée du profil
# (CompletionGate — XML porte écartée préservé, LOG jamais ; comportement
# identique côté hôte) ; correctifs retour terrain (RegexCompat classes POSIX,
# captures vide/imbriquées, porte 5 000 caractères/ligne). Aucune rupture
# d'API 3.71.0 → 3.72.0 (vérifié : cel-ui = EditorTheme + EditorCompletionPopup
# seulement, cel-lsp/cel-lsp-api = README).
# Historique — montée 3.70.1 → 3.71.0 (v0.134.12) : plan d'audit 3.69.0
# (lots L1→L10). UNE rupture consommée par CodeIDE (plan 03 — inversion
# cel-lsp → cel-ui) : LspEditor.setEditorView(EditorView) → setHost(EditorHost) ;
# l'adaptation est l'une-ligne fournie par l'amont — editeur.setHost(LspEditorViewHost(vue))
# (CoordonnateurLsp). Le reste est compatible : plan 01 = extractions d'état
# d'EditorView (view/state/ CompletionState, FindState, ScrollState) avec API
# publique inchangée (getVOffset/getHOffset délèguent, champs internalisés non
# consommés par CodeIDE — vérifié par grep) ; D-01 = complétion snippets +
# textEdit + filterText/sortText (transparents côté hôte) ; L1-bis = timeouts
# LSP par requête (LanguageServerDefinition.setTimeouts, additif, non posé) ;
# OnTextEditListener gagne une variante 4-arg DEFAULT (3-arg conservé) ;
# SymbolBarView = interne accessibilité A-05 (performClick). Licence du dépôt
# code-editor : MIT → Apache-2.0 (les notices tierces deviennent exactes).
# Montée 3.49.2 → 3.69.0 (v0.122.2) : compat API vérifiée par le guide
# MISE-A-JOUR-CODEIDE.md (docs/ du dépôt code-editor) — plage additive.
# CodeEditor côté CodeIDE ne change pas (les deux modules suivent version.ref).
# Montée 3.72.0 → 3.74.0 (v0.168.0) : phase 2 du chantier « Capacités
# LSP fermées par défaut » (ADR 0136) — la montée franchit AUSSI la 3.73.0
# (carte d'aperçu « goutte d'eau » + IME au niveau plateforme : AUCUN
# contournement clavier à retirer côté CodeIDE — vérifié, seul le filtre
# logcat masque le clavier, hors EditorView). 3.74.0 = cycle de vie du
# langage (disconnect() restaure EmptyLanguage — ADR 0136 D1 : le défaut
# qui laissait fuiter les capacités du fichier précédent est corrigé DANS
# LA BIBLIOTHÈQUE, aucun contournement local) + formatage complet :
# canFormat()/canFormatSelection()/formatSelection(Consumer<Boolean>)/
# setFormattingOptions(int,boolean), Ctrl+Shift+K physique porté par la
# bibliothèque (EditorCommands.FORMAT_SELECTION). Consommé du lot :
# pilotage de « Formater » par canFormat() (D4), « Formater la sélection »
# dans la pill de sélection (grisée par canFormatSelection()), options
# de formatage alimentées par le réglage « Largeur de tabulation »
# RÉINTRODUIT (ADR 0066 : « réintroduits si la bibliothèque expose un
# jour les setters » — setFormattingOptions EST ce setter). Aucune
# rupture d'API (note de passage §3.74.0 du dépôt frère : tout est
# additif, méthodes default ou nouvelles) ; artefacts JitPack v3.74.0
# vérifiés HTTP 200 (cel-ui, cel-lsp, cel-lsp-api).
# Montée 3.74.0 → 4.0.0 (bump-frère du 2026-10-24, instruction
# propriétaire « mettre à jour la version des dépôts frères et aussi
# dans CodeIDE ») : refonte INTERNE de cel-textmate (moteur natif du
# dialecte, plan 10 — les 7 règles markdown à récursion et la règle CSS
# selector compilent nativement, budget 100 ms par essai : un motif
# catastrophique se replie en non-correspondance) + régime PROGRESSIF
# des grands documents dans cel-core (plan 11 : au-delà de 800 lignes
# plus AUCUNE passe complète — états en arrière-plan interruptibles,
# spans à la demande, cache LRU 4 096 lignes ; ouverture 480k lignes
# ~619 ms → ~200-330 ms, tas 147 Mo → ~26 Mo) + corpus de grammaires
# porté de 10 à 23 (c, cpp, dockerfile, go, json, php, ruby, rust,
# shell, sql, toml, typescript, yaml MIT/Apache-2.0 VERBATIM) — le
# panneau couleur de CodeIDE gagne 13 langages SANS AUCUN changement
# de code. API hôte : UNIQUEMENT l'additif `hintViewport(first,last)`
# (EditorView, plan 11 — optionnel, non consommé pour l'instant) ; la
# constante renommée TEXTMATE_LINE_LIMIT → TEXTMATE_EAGER_LIMIT est
# interne à cel-core (vérifié : aucun usage côté CodeIDE). Le tag
# v4.0.0 porte le correctif des plafonds de bancs sur runners CI
# partagés (849bf3c — la 4.0.0 tagée EST la 4.0.0 testée) ; build
# JitPack v4.0.0 « ok » (API builds, vérifié le 2026-10-24 : 4.0.0 et
# v4.0.0 tous deux ok). MONTÉE 4.1.0 (C3 — ADR 0142, bump-frère) : le
# contrat interactif B27-C3 du corps de la carte « goutte d'eau »
# (wantsInteractiveDropPreview/onPreviewDropTouch/onPreviewDropLongPress,
# méthodes à défaut — les hôtes non interactifs au bit près) ; build
# JitPack v4.1.0 « ok » (l'API B27-C3 compile côté CodeIDE — la chaîne
# locale de v0.176.0 a résolu et testé l'artefact). MONTÉE 4.2.0
# (C4 — ADR 0143, bump-frère) : le contrat B28 des YEUX ANCRÉS — un
# œil par `@Preview` À SA LIGNE, façon Android Studio
# (setPreviewAnchors — null = comportement B27 au bit près, VIDE =
# aucun œil ; hitTestGutterPreviewAnchor ; onPreviewAnchorTapped à
# défaut ; selectPreviewDropTab — miroir d'un tap d'onglet) ; build
# JitPack v4.2.0 « ok » (la chaîne locale de v0.177.0 a résolu et
# testé l'artefact).
code-editor = "v4.2.0"
# Termux terminal-emulator (Apache-2.0) : sessions shell via pty — v0.118.3
# vérifiée sur JitPack le 2026-09-23 (com.github.termux.termux-app).
termux = "v0.118.3"
androidx-splashscreen = "1.2.0"
androidx-datastore = "1.2.1"
material = "1.14.0"

# Kotlin (bibliothèques).
coroutines = "1.11.0"
serialization = "1.9.0"
# LSP Kotlin (K1, ADR 0115) : org.jetbrains:syntax-api — l'arbre de
# construction syntaxique de la plateforme IntelliJ, contre lequel la
# grammaire vendorée du compilateur Kotlin est écrite. Hors Central :
# dépôt intellij-dependencies (accès par cache-redirector, voir
# settings.gradle.kts). Version épinglée par le tag amont v2.3.0 dans son
# propre libs.versions.toml — à monter ENSEMBLE du vendoring
# (lsp/kotlin/src/main/vendor/VENDOR.md). jetbrains-annotations (Central)
# est la seconde dépendance amont.
jetbrains-syntax-api = "0.3.340"
jetbrains-annotations = "26.0.2"
# K3 (LSP_KOTLIN.md §5) : lecture des @Metadata des bibliothèques Kotlin
# du classpath (appelables de premier niveau + extensions) — même version
# que le compilateur du build (2.2.10), la bibliothèque suit le
# compilateur au pas ; zéro transitif gênant (LSP_KOTLIN §6 : embarquée
# dans le futur « pack langue » avec la grammaire).
kotlin-metadata-jvm = "2.2.10"

# Tests.
junit4 = "4.13.2"
androidx-test-core = "1.7.0"
robolectric = "4.17"
turbine = "1.2.1"
# org.json réel pour les tests JVM purs de core:crash (les stubs android.jar
# lèvent « not mocked » ; version vérifiée sur Maven Central).
org-json = "20260814"
turbine-coroutines-test = "1.11.0"

# Diagnostics en debug.
leakcanary = "2.14"

# Qualité (section 6 du prompt).
detekt = "1.23.8"
spotless = "8.10.2"
ktlint = "1.8.0"
kover = "0.9.9"
dokka = "2.2.0"

# Tooling Gradle (prompt compagnon Tooling — versions VÉRIFIÉES sur les dépôts
# officiels le 2026-09-24, jour de G2, et documentées dans docs/TOOLING.md) :
# gradle-tooling-api 9.7.1 = dernière stable, ALIGNÉE sur le Gradle du wrapper —
# les métadonnées Maven Central de cette coordonnée sont périmées (7.3-snapshot
# de 2021) : le dépôt de référence est repo.gradle.org/gradle/libs-releases,
# ajouté à settings.gradle.kts. (Le plugin shadow est parti avec
# codeide-tooling — bascule 2026-10-17 : il vit dans le catalogue de ce dépôt.)
gradle-tooling-api = "9.7.1"

# Divers.
javax-inject = "1"
# Previews (PE1, PREVIEW.md P2 révisée 2026-10-13) : moteur de rendu XML
# LayoutLib — dépôt personnel jjoblab/LayoutLib du propriétaire. MODE
# HYBRIDE (arbitrage 2026-10-17) : composite en dev (substitution des
# coordonnées com.github.jjoblab.LayoutLib:* par le checkout frère,
# settings.gradle.kts) ; en BINAIRE, GitHub Packages (publication 3.4.7,
# workflow publish.yml du dépôt — jeton de lecture requis ; JitPack reste
# écarté, décision maintenue). La version = PIN du ref git attendu (tag
# v3.4.9 — bibliothèques Material/AndroidX DANS module-inflater, repli
# thème Material3 au lieu du MockView, tags courts MaterialToolbar/
# MaterialRatingBar/SearchBar/MaterialButtonToggleGroup) en composite,
# de la publication en binaire — la substitution ignore la version
# déclarée ; la mise à jour = bump ici + ref du clonage CI.
layoutlib = "3.7.0"

# Dépôts séparés (bascule 2026-10-17, docs/archive/PLAN_SEPARATION_DEPOTS.md §9) :
# protocol/api/server/testing (codeide-tooling) et les 8 modules lsp
# (codeide-lsp) consommés en coordonnées externes — composite en dev
# (substitution, settings.gradle.kts), BINAIRE depuis GitHub Packages
# (workflows publish.yml des deux dépôts ; JitPack reste l'alternative
# documentée). Version = PIN du ref git attendu (tags v1.0.0) en
# composite, de la publication en binaire ; la substitution ignore la
# version déclarée — la mise à jour = bump ici + ref du clonage CI.
codeide-tooling = "1.0.0"
# MONTÉE 1.8.0 (v0.180.0) : v1.8.0 livre les CINQ demandes du chantier
# indexation transmises par docs/DEMANDES_CODEIDE_LSP.md (ADR 0211–0214 —
# D1 supplier de connexion sans E/S + cache mémoire des segments, D2 filet
# de scan synchrone supprimé + verrou lecture-écriture, D3 etatIndexation
# Kotlin/XML RICHE (même type public que Java), D4 reesayerEchecs() ciblé,
# D5 annulerPassage() coopératif). Toutes ADDITIVES : la surface hôte
# consommée par CodeIDE (SessionLsp*/CapaciteLsp/TypesIndexationPublics)
# n'en est que RICHE (etatIndexation sur les 3 façades, annulerPassage()/
# reesayerEchecs() : Boolean) — le branchement UI vit dans cette version
# (ADR 0146 : agrégat multi-moteurs sur les flux RÉELS + boutons enfin
# distincts). v1.9.0 (v0.181.0 — retour propriétaire E2E sur projets
# Android réels, ADR 0215/0216 côté frère) : ROUTAGE fichier → module du
# serveur Java (les moteurs par module ENFIN consultés — `Greeter` même
# paquet et `ActivityMainBinding` ViewBinding résolvent, go-to Java
# réparés de bout en bout) et `kt.unresolved` sans faux positifs
# (membres HÉRITÉS : setContentView/instantiate ; segments de types
# QUALIFIÉS : android.os.Bundle) — SANS changement de surface consommée
# (v1.8.0 intact). Publication GitHub Packages du tag v1.9.0 vérifiée
# (maven-metadata codeide-lsp/host : 1.9.0 visible). Montées précédentes :
# 1.8.0 (v0.180.0 — écran d'indexation multi-moteurs, ADR 0146),
# 1.7.0 (v0.179.0 — GO TO symétrique, ADR 0208–0210), 1.5.0 (C4 — ADR
# 0143, ligne d'annotation @Preview).
codeide-lsp = "1.9.0"

# Mission « Previews » Compose (PREVIEW.md §4 — PC2 : runtime Compose
# EMBARQUÉ comme bibliothèque d'interprétation dans :preview:compose,
# ADR 0002 intact — pas de Compose pour l'UI CodeIDE). BOM vérifiée sur
# Google Maven ; le plugin compose est livré AVEC Kotlin (2.0+).
compose-bom = "2026.09.00"

# Propriétaire d'état sauvegardé hors fenêtre (SavedStateRegistry factice
# de l'exécuteur off-screen :preview:compose) — version stable vérifiée
# sur Google Maven.
savedstate = "1.3.3"

# Interface ViewBinding pour core:ui (même version que l'AGP, vérifié sur Google Maven ;
# AGP l'ajoute automatiquement aux modules qui activent viewBinding, core:ui la déclare explicitement).
viewbinding = "9.4.1"

# Mission « LSP Java » (prompt 2 — versions du module vendored lsp-java, vérifiées sur
# les dépôts officiels le 2026-10-11 : Maven Central pour jdt/lsp4j/gson/asm/junit-jupiter,
# Google Maven pour builder-model qui suit le train de versions de l'AGP).
eclipse-jdt-core = "3.40.0"
lsp4j = "0.21.2"
gson = "2.10.1"
asm = "9.7"
junit-jupiter = "5.10.1"
# La version du lanceur suit la version de la PLATEFORME JUnit (1.10.x
# pour Jupiter 5.10.x), pas celle de Jupiter.
junit-platform = "1.10.1"
# builder-model (com.android.tools.build) : interfaces du modèle v2 d'AGP résolu via
# la Tooling API — même train de versions que l'AGP (9.4.1), vérifié sur Google Maven.
# Compatible avec les projets cibles AGP 8+ (les interfaces v2 sont stables depuis 8.0).
builder-model = "9.4.1"

[libraries]
# AndroidX de base.
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidx-viewpager2" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidx-datastore" }

# Navigation.
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidx-navigation" }

# Cycle de vie.
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }

# Interface.
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Bibliothèque d'édition : seul module autorisé en dehors du catalogue usuel
# dans une feature (prompt compagnon, section 3) — embarque cel-core et
# cel-lsp-api en transitif.
codeeditor-ui = { group = "com.github.jjoblab.code-editor", name = "cel-ui", version.ref = "code-editor" }
# cel-lsp (mission « LSP Java » étape 4, §10) : intégration des serveurs de
# langage à l'éditeur (LspProject/LspEditor, transport in-process) — réservé
# à :lsp:hôte, PAS aux features (cel-ui reste la seule exception feature).
codeeditor-lsp = { group = "com.github.jjoblab.code-editor", name = "cel-lsp", version.ref = "code-editor" }
termux-terminal-emulator = { group = "com.github.termux.termux-app", name = "terminal-emulator", version.ref = "termux" }
termux-terminal-view = { group = "com.github.termux.termux-app", name = "terminal-view", version.ref = "termux" }

# Persistance.
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Injection (l'API @Inject du domaine est javax.inject, pure JVM).
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javax-inject" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Interface ViewBinding (BaseFragment de core:ui ; suit la version de l'AGP).
androidx-viewbinding = { group = "androidx.databinding", name = "viewbinding", version.ref = "viewbinding" }

# Kotlin.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "turbine-coroutines-test" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Tooling Gradle (G2) : orchestrateur Tooling API (tooling:server uniquement).
gradle-tooling-api = { group = "org.gradle", name = "gradle-tooling-api", version.ref = "gradle-tooling-api" }

# Mission « LSP Java » — moteur vendored :lsp:java (jar Eclipse patché pour ART,
# lsp4j pour la façade LSP, gson pour les types de l'ancienne couche app) ;
# :lsp:ecj-art (patcheur ASM du build) ; :lsp:java en JUnit 5 (suite vendored) ;
# tooling:server consomme builder-model (modèle v2 AGP — étape 1).
eclipse-jdt-core = { group = "org.eclipse.jdt", name = "org.eclipse.jdt.core", version.ref = "eclipse-jdt-core" }
lsp4j = { group = "org.eclipse.lsp4j", name = "org.eclipse.lsp4j", version.ref = "lsp4j" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
android-builder-model = { group = "com.android.tools.build", name = "builder-model", version.ref = "builder-model" }

# Mission « LSP Kotlin » — :lsp:kotlin (K1, ADR 0115) : ce contre quoi la
# grammaire vendorée est écrite (api : nos types exposent SyntaxElementType)
# + annotations de l'amont (implementation).
jetbrains-syntax-api = { group = "org.jetbrains", name = "syntax-api", version.ref = "jetbrains-syntax-api" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
# K3 : décodage @Metadata des libs Kotlin du classpath (appelables top +
# extensions — cf. version pour le commentaire).
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin-metadata-jvm" }

# Mission « Previews » (PE1) : moteur de rendu XML (P1 — LayoutLib, dépôt
# personnel jjoblab, composite source P2 révisée ; les modules frères
# transitent par les api(project(...)) du build inclus).
layoutlib-inflater = { group = "com.github.jjoblab.LayoutLib", name = "module-inflater", version.ref = "layoutlib" }

# Mission « Previews » C2 (PREVIEW.md §4.4) : la composition Compose
# CONSULTE les MÊMES résolveurs PE1 que le moteur XML (réutilisation,
# jamais réinvention — étude PE14 §5.3-1 « une seule machinerie, deux
# dialectes ») : module-resources (qualifiers night/lang, chaînage des
# références) + module-themes (chaîne d'héritage des styles). Statut
# hors audit ProjectDependency de :preview:compose — coordonnées
# EXTERNES, même statut que lsp-kotlin côté feature:editor (ADR 0140).
layoutlib-resources = { group = "com.github.jjoblab.LayoutLib", name = "module-resources", version.ref = "layoutlib" }
layoutlib-themes = { group = "com.github.jjoblab.LayoutLib", name = "module-themes", version.ref = "layoutlib" }

# Dépôts séparés (bascule 2026-10-17) — voir la section versions.
tooling-protocol = { group = "com.github.jjoblab.codeide-tooling", name = "protocol", version.ref = "codeide-tooling" }
tooling-api = { group = "com.github.jjoblab.codeide-tooling", name = "api", version.ref = "codeide-tooling" }
tooling-server = { group = "com.github.jjoblab.codeide-tooling", name = "server", version.ref = "codeide-tooling" }
tooling-testing = { group = "com.github.jjoblab.codeide-tooling", name = "testing", version.ref = "codeide-tooling" }
lsp-host = { group = "com.github.jjoblab.codeide-lsp", name = "host", version.ref = "codeide-lsp" }
lsp-kotlin = { group = "com.github.jjoblab.codeide-lsp", name = "kotlin", version.ref = "codeide-lsp" }

# Runtime Compose embarqué (PC1/PC2 — bibliothèque d'interprétation du
# module :preview:compose, Jamais l'UI CodeIDE — ADR 0002).
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate-ktx", version.ref = "savedstate" }

# Tests unitaires JVM.
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidx-test-core" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
org-json = { group = "org.json", name = "json", version.ref = "org-json" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# Diagnostics en debug.
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
